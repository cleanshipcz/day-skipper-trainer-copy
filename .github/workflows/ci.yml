name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  supabase-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Verify generated database types
        run: npm run guard:supabase-types

      - name: Upload generated database types on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-types-generated
          path: .tmp/supabase-types.generated.ts
          if-no-files-found: error
          retention-days: 1

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run --maxWorkers=1

      - name: Coverage
        run: npm run guard:coverage-scope && npm run test:coverage -- --maxWorkers=1

      - name: Build
        run: npm run build

      - name: Boat Parts asset lifecycle guard
        run: npm run guard:boat-parts-assets

      - name: Install pinned Chromium for browser checks
        run: npm run setup:anchor-browser

      - name: Anchor minigame browser characterization
        # GitHub's disposable Ubuntu runner does not expose Chromium's user-
        # namespace sandbox. This opt-out is scoped to a headless test profile
        # that serves and visits only the loopback-only Vite preview.
        env:
          CHROMIUM_NO_SANDBOX: "1"
        run: npm run test:anchor-browser

      - name: Sail Controls responsive browser characterization
        # Match the scoped sandbox opt-out above: this test uses an isolated
        # profile and a loopback-only Vite preview.
        env:
          CHROMIUM_NO_SANDBOX: "1"
        run: npm run test:sail-controls-browser

      - name: Ropework accessibility browser characterization
        # Match the scoped sandbox opt-out above: this test uses an isolated
        # profile and a loopback-only Vite preview.
        env:
          CHROMIUM_NO_SANDBOX: "1"
        run: npm run test:ropework-accessibility-browser

      - name: Build budget
        run: npm run test:build-budget

      - name: Quiz chunk strategy
        run: npm run test:quiz-chunks

      - name: Migration guard
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run guard:migrations

      - name: Internal artifact guard
        run: npm run guard:no-internal-artifacts
