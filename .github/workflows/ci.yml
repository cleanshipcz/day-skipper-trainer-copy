name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run --maxWorkers=1

      - name: Coverage
        run: npm run test:coverage -- --maxWorkers=1

      - name: Build
        run: npm run build

      - name: Build budget
        run: npm run test:build-budget

      - name: Migration guard
        run: npm run guard:migrations

      - name: Internal artifact guard
        run: npm run guard:no-internal-artifacts
