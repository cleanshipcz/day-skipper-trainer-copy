name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run --maxWorkers=1

      - name: Coverage
        run: npm run guard:coverage-scope && npm run test:coverage -- --maxWorkers=1

      - name: Build
        run: npm run build

      - name: Install pinned Chromium for anchor browser checks
        run: npm run setup:anchor-browser

      - name: Anchor minigame browser characterization
        run: npm run test:anchor-browser

      - name: Build budget
        run: npm run test:build-budget

      - name: Quiz chunk strategy
        run: npm run test:quiz-chunks

      - name: Migration guard
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run guard:migrations

      - name: Internal artifact guard
        run: npm run guard:no-internal-artifacts
