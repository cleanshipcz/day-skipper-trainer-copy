<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Cold front moving east toward Harbour H</title>
  <desc id="desc">A cold front moved 120 nautical miles east in six hours and remains 80 nautical miles west of Harbour H.</desc>
  <rect width="720" height="240" fill="#eff6ff"/><path d="M70 60 C160 95 210 145 290 190" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="56" y="40" font-family="sans-serif" font-size="18" fill="#334155">6 hours ago</text>
  <path d="M310 45 C395 85 430 140 500 195" fill="none" stroke="#155e75" stroke-width="7"/>
  <g fill="#155e75"><path d="M350 61 l28 2 -18 22z"/><path d="M404 96 l27 7 -21 18z"/><path d="M448 139 l25 12 -24 13z"/></g>
  <path d="M245 120 H315" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/><path d="M500 120 H620" stroke="#111827" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="620" cy="120" r="24" fill="#fff" stroke="#111827" stroke-width="4"/><text x="611" y="128" font-family="sans-serif" font-size="24" font-weight="bold">H</text>
  <text x="520" y="105" font-family="sans-serif" font-size="18">80 NM</text><text x="200" y="205" font-family="sans-serif" font-size="18">120 NM in 6 h</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="18" y="228" font-family="sans-serif" font-size="13" fill="#334155">Educational schematic based on Met Office surface-pressure chart conventions; not for navigation.</text>
</svg>
